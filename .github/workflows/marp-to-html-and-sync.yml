name: Generate HTML and Update Metadata

on:
  schedule:
    # 毎時 0 分（UTC）に実行
    - cron: '0 * * * *'
  workflow_dispatch: # 手動実行を許可

# 生成物を push するため contents: write のみ付与する（Issues / PR は操作しない）
permissions:
  contents: write

# 毎時実行が重なって push が競合しないよう直列化する
concurrency:
  group: marp-to-html-and-sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions はタグではなくコミット SHA で固定（更新は Dependabot）
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'
          cache: npm

      # 日本語フォントをインストール（Marp/Puppeteer によるPNGレンダリングに必要）
      - name: Install Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -fv

      # Marp CLI / Wrangler は package.json + package-lock.json でバージョン固定
      # （install スクリプトは実行しない。Chrome はランナー同梱のものを使う）
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate slide.html from slide.md
        run: |
          converted_count=0
          skipped_count=0
          failed_count=0
          converted_files=""
          skipped_files=""
          failed_files=""

          echo "Processing slide.md files without HTML..."
          mapfile -d '' files < <(find . -path ./node_modules -prune -o -type f -name "slide.md" -print0)
          for file in "${files[@]}"; do
            dir=$(dirname "$file")
            html_file="$dir/slide.html"
            if [ ! -f "$html_file" ]; then
              echo "  ✓ Converting $file..."
              if npx --no-install marp --config-file ./.marprc.yml -o "$html_file" -- "$file" < /dev/null; then
                converted_count=$((converted_count + 1))
                converted_files="${converted_files}\n  - ${file}"
              else
                echo "  ✗ Failed to convert $file"
                failed_count=$((failed_count + 1))
                failed_files="${failed_files}\n  - ${file}"
              fi
            else
              echo "  - Skipping $file (HTML already exists)"
              skipped_count=$((skipped_count + 1))
              skipped_files="${skipped_files}\n  - ${file}"
            fi
          done

          echo ""
          echo "=== Conversion Summary ==="
          echo "Converted: $converted_count file(s)"
          echo "Skipped:   $skipped_count file(s)"
          echo "Failed:    $failed_count file(s)"
          if [ "$converted_count" -gt 0 ]; then
            echo ""
            echo "Converted files:"
            printf "%b\n" "$converted_files"
          fi
          if [ "$skipped_count" -gt 0 ]; then
            echo ""
            echo "Skipped files:"
            printf "%b\n" "$skipped_files"
          fi
          if [ "$failed_count" -gt 0 ]; then
            echo ""
            echo "Failed files:"
            printf "%b\n" "$failed_files"
          fi

      # サムネイル生成（各スライドの1枚目をPNG化）
      - name: Generate thumbnails from slide.md
        run: |
          set +e
          shopt -s nullglob

          generated_count=0
          regenerated_count=0
          skipped_count=0
          failed_count=0
          generated_files=""
          regenerated_files=""
          skipped_files=""
          failed_files=""
          newly_generated_list="/tmp/new_thumbnails.txt"
          : > "$newly_generated_list"

          mapfile -d '' files < <(find . -path ./node_modules -prune -o -type f -name "slide.md" -print0)
          for file in "${files[@]}"; do
            dir=$(dirname "$file")
            summary_md="$dir/summary.md"
            slide_html="$dir/slide.html"
            is_regenerate=false
            if [ -f "$summary_md" ] && [ -f "$slide_html" ]; then
              if [ -f "$dir/thumbnail.png" ]; then
                slide_time=$(git log -1 --format="%at" -- "$file")
                thumb_time=$(git log -1 --format="%at" -- "$dir/thumbnail.png")
                if [ -n "$slide_time" ] && [ -n "$thumb_time" ] && [ "$slide_time" -gt "$thumb_time" ]; then
                  echo "  ↻ slide.md updated after thumbnail, regenerating: $file"
                  rm "$dir/thumbnail.png"
                  is_regenerate=true
                  # fall through to generation
                else
                  echo "Skipping $file (thumbnail is up to date)"
                  skipped_count=$((skipped_count + 1))
                  skipped_files="${skipped_files}\n  - ${file}"
                  continue
                fi
              fi
              echo "Generating thumbnail for $file..."
              if npx --no-install marp --config-file ./.marprc.yml --image png -o "$dir/thumbnail.png" -- "$file" < /dev/null; then
                if [ "$is_regenerate" = "true" ]; then
                  regenerated_count=$((regenerated_count + 1))
                  regenerated_files="${regenerated_files}\n  - ${file}"
                else
                  generated_count=$((generated_count + 1))
                  generated_files="${generated_files}\n  - ${file}"
                fi
                echo "$dir/thumbnail.png" >> "$newly_generated_list"
              else
                echo "  ✗ Failed to convert $file"
                failed_count=$((failed_count + 1))
                failed_files="${failed_files}\n  - ${file}"
              fi
            else
              echo "Skipping $file (missing summary.md or slide.html)"
              skipped_count=$((skipped_count + 1))
              skipped_files="${skipped_files}\n  - ${file}"
            fi
          done

          echo ""
          echo "=== Thumbnail Summary ==="
          echo "Generated:    $generated_count file(s)"
          echo "Regenerated:  $regenerated_count file(s)"
          echo "Skipped:      $skipped_count file(s)"
          echo "Failed:       $failed_count file(s)"
          if [ "$generated_count" -gt 0 ]; then
            echo ""
            echo "Generated files:"
            printf "%b\n" "$generated_files"
          fi
          if [ "$regenerated_count" -gt 0 ]; then
            echo ""
            echo "Regenerated files:"
            printf "%b\n" "$regenerated_files"
          fi
          if [ "$skipped_count" -gt 0 ]; then
            echo ""
            echo "Skipped files:"
            printf "%b\n" "$skipped_files"
          fi
          if [ "$failed_count" -gt 0 ]; then
            echo ""
            echo "Failed files:"
            printf "%b\n" "$failed_files"
          fi

          echo ""
          echo "New thumbnails list: $newly_generated_list"
          wc -l "$newly_generated_list" || true

      # メタデータを生成（全てのKVキー）
      - name: Generate metadata
        env:
          THUMBNAIL_BASE_URL: ${{ secrets.THUMBNAIL_BASE_URL }}
        run: |
          node .github/scripts/generate-metadata.mjs . all > metadata-all.json
          echo "Generated metadata for $(cat metadata-all.json | jq -r '."metadata:index".totalCount') articles"

      # sitemap.xml を生成
      - name: Generate sitemap.xml
        run: |
          node .github/scripts/generate-sitemap.mjs metadata-all.json > sitemap.xml
          echo "Generated sitemap.xml ($(grep -c '<url>' sitemap.xml) URLs)"

      # Wrangler CLIでKVを更新
      # secrets は run スクリプトへ式展開で直接埋め込まず env 経由で渡す（シェル解釈・ログ混入を避ける）
      - name: Update Workers KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: |
          set -euo pipefail

          put_kv() {
            # $1: KV キー（metadata-all.json のキー名をそのまま使う）
            jq --arg k "$1" '.[$k]' metadata-all.json | \
              npx --no-install wrangler kv key put "$1" \
                --namespace-id="$KV_NAMESPACE_ID" \
                --remote \
                --path=/dev/stdin
          }

          # metadata:index / metadata:months を更新
          put_kv "metadata:index"
          put_kv "metadata:months"

          # 各月のメタデータを更新
          jq -r 'keys[] | select(startswith("metadata:") and (. != "metadata:index") and (. != "metadata:months"))' metadata-all.json | \
            while IFS= read -r key; do
              echo "Updating $key..."
              put_kv "$key"
            done

      # 生成したサムネイルをR2にアップロード
      - name: Upload thumbnails to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          newly_generated_list="/tmp/new_thumbnails.txt"
          if [ ! -s "$newly_generated_list" ]; then
            echo "No new thumbnails to upload."
            exit 0
          fi

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            # 例: 2026/02/06/Topic/thumbnail.png
            key=${file#./}
            echo "Uploading $file to R2 as $key..."
            npx --no-install wrangler r2 object put "$R2_BUCKET/$key" --remote --file "$file"
          done < "$newly_generated_list"

      # HTMLファイルをコミット
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "**/slide.html" metadata-all.json sitemap.xml
          git add "**/thumbnail.png" || true
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "Generate HTML, metadata, and sitemap [skip ci]"
          git push
