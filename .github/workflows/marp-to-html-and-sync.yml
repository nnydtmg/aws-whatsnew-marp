name: Generate HTML and Update Metadata

on:
  schedule:
    # 毎時0分に実行（GitHub側の混雑により実際の実行は遅延・間引きされることがある）
    - cron: '0 * * * *'
  workflow_dispatch: # 手動実行を許可
    inputs:
      force_kv_update:
        description: '差分に関係なく全メタデータキーをKVに書き込む'
        type: boolean
        default: false

permissions:
  contents: write     # リポジトリ内容: read/write/none (pushするためwriteが必要)
  issues: write       # Issues: read/write/none
  pull-requests: write # PR: read/write/none
  actions: read       # 前回成功した実行のコミットを取得するため

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 前回成功した実行以降に変更された記事を検出
      # - slide.md が変更された記事の slide.html 再生成
      # - marp-site のコンテンツキャッシュ削除（/api/sync）
      # に使用する。チェックアウトは履歴1件のみのため、GitHub の compare API で差分を取得する
      - name: Detect changed articles
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed_files="$RUNNER_TEMP/changed_files.txt"
          : > "$changed_files"

          base_sha=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow marp-to-html-and-sync.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json headSha \
            --jq '.[0].headSha // empty' || true)

          if [ -z "$base_sha" ]; then
            echo "No previous successful run found. Skipping change detection."
          elif [ "$base_sha" = "$GITHUB_SHA" ]; then
            echo "No new commits since last successful run ($base_sha)."
          elif gh api "repos/$GITHUB_REPOSITORY/compare/${base_sha}...${GITHUB_SHA}?per_page=100" \
              --paginate --jq '.files[].filename' > "$changed_files"; then
            echo "Compared ${base_sha}...${GITHUB_SHA}: $(wc -l < "$changed_files") file(s) changed"
          else
            echo "::warning::Failed to compare ${base_sha}...${GITHUB_SHA}. Skipping change detection."
            : > "$changed_files"
          fi

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "changed_files=$changed_files" >> "$GITHUB_OUTPUT"

      # 日本語フォントをインストール（Marp/Puppeteer によるPNGレンダリングに必要）
      - name: Install Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -fv

      # Marp CLIでHTMLを生成
      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli

      - name: Generate slide.html from slide.md
        run: |
          converted_count=0
          skipped_count=0
          failed_count=0
          converted_files=""
          skipped_files=""
          failed_files=""

          echo "Processing slide.md files without HTML..."
          mapfile -d '' files < <(find . -type f -name "slide.md" -print0)
          for file in "${files[@]}"; do
            dir=$(dirname "$file")
            html_file="$dir/slide.html"
            # 前回成功した実行以降に slide.md が変更されていれば再生成する
            slide_changed=false
            if grep -qxF "${file#./}" "${{ steps.changed.outputs.changed_files }}"; then
              slide_changed=true
            fi
            if [ ! -f "$html_file" ] || [ "$slide_changed" = "true" ]; then
              if [ -f "$html_file" ]; then
                echo "  ↻ slide.md updated, regenerating $html_file..."
              else
                echo "  ✓ Converting $file..."
              fi
              if marp --html --allow-local-files --theme ./themes/aws-whatsnew.css "$file" -o "$html_file" < /dev/null; then
                converted_count=$((converted_count + 1))
                converted_files="${converted_files}\n  - ${file}"
              else
                echo "  ✗ Failed to convert $file"
                failed_count=$((failed_count + 1))
                failed_files="${failed_files}\n  - ${file}"
              fi
            else
              echo "  - Skipping $file (HTML already exists)"
              skipped_count=$((skipped_count + 1))
              skipped_files="${skipped_files}\n  - ${file}"
            fi
          done

          echo ""
          echo "=== Conversion Summary ==="
          echo "Converted: $converted_count file(s)"
          echo "Skipped:   $skipped_count file(s)"
          echo "Failed:    $failed_count file(s)"
          if [ "$converted_count" -gt 0 ]; then
            echo ""
            echo "Converted files:"
            printf "%b\n" "$converted_files"
          fi
          if [ "$skipped_count" -gt 0 ]; then
            echo ""
            echo "Skipped files:"
            printf "%b\n" "$skipped_files"
          fi
          if [ "$failed_count" -gt 0 ]; then
            echo ""
            echo "Failed files:"
            printf "%b\n" "$failed_files"
          fi

      # サムネイル生成（各スライドの1枚目をPNG化）
      - name: Generate thumbnails from slide.md
        run: |
          set +e
          shopt -s nullglob

          generated_count=0
          regenerated_count=0
          skipped_count=0
          failed_count=0
          generated_files=""
          regenerated_files=""
          skipped_files=""
          failed_files=""
          newly_generated_list="/tmp/new_thumbnails.txt"
          : > "$newly_generated_list"

          mapfile -d '' files < <(find . -type f -name "slide.md" -print0)
          for file in "${files[@]}"; do
            dir=$(dirname "$file")
            summary_md="$dir/summary.md"
            slide_html="$dir/slide.html"
            is_regenerate=false
            if [ -f "$summary_md" ] && [ -f "$slide_html" ]; then
              if [ -f "$dir/thumbnail.png" ]; then
                slide_time=$(git log -1 --format="%at" -- "$file")
                thumb_time=$(git log -1 --format="%at" -- "$dir/thumbnail.png")
                if [ -n "$slide_time" ] && [ -n "$thumb_time" ] && [ "$slide_time" -gt "$thumb_time" ]; then
                  echo "  ↻ slide.md updated after thumbnail, regenerating: $file"
                  rm "$dir/thumbnail.png"
                  is_regenerate=true
                  # fall through to generation
                else
                  echo "Skipping $file (thumbnail is up to date)"
                  skipped_count=$((skipped_count + 1))
                  skipped_files="${skipped_files}\n  - ${file}"
                  continue
                fi
              fi
              echo "Generating thumbnail for $file..."
              if marp --image png --allow-local-files --theme ./themes/aws-whatsnew.css "$file" -o "$dir/thumbnail.png" < /dev/null; then
                if [ "$is_regenerate" = "true" ]; then
                  regenerated_count=$((regenerated_count + 1))
                  regenerated_files="${regenerated_files}\n  - ${file}"
                else
                  generated_count=$((generated_count + 1))
                  generated_files="${generated_files}\n  - ${file}"
                fi
                echo "$dir/thumbnail.png" >> "$newly_generated_list"
              else
                echo "  ✗ Failed to convert $file"
                failed_count=$((failed_count + 1))
                failed_files="${failed_files}\n  - ${file}"
              fi
            else
              echo "Skipping $file (missing summary.md or slide.html)"
              skipped_count=$((skipped_count + 1))
              skipped_files="${skipped_files}\n  - ${file}"
            fi
          done

          echo ""
          echo "=== Thumbnail Summary ==="
          echo "Generated:    $generated_count file(s)"
          echo "Regenerated:  $regenerated_count file(s)"
          echo "Skipped:      $skipped_count file(s)"
          echo "Failed:       $failed_count file(s)"
          if [ "$generated_count" -gt 0 ]; then
            echo ""
            echo "Generated files:"
            printf "%b\n" "$generated_files"
          fi
          if [ "$regenerated_count" -gt 0 ]; then
            echo ""
            echo "Regenerated files:"
            printf "%b\n" "$regenerated_files"
          fi
          if [ "$skipped_count" -gt 0 ]; then
            echo ""
            echo "Skipped files:"
            printf "%b\n" "$skipped_files"
          fi
          if [ "$failed_count" -gt 0 ]; then
            echo ""
            echo "Failed files:"
            printf "%b\n" "$failed_files"
          fi

          echo ""
          echo "New thumbnails list: $newly_generated_list"
          wc -l "$newly_generated_list" || true

      # メタデータを生成（全てのKVキー）
      - name: Generate metadata
        env:
          THUMBNAIL_BASE_URL: ${{ secrets.THUMBNAIL_BASE_URL }}
        run: |
          # 前回KVに書き込んだ内容（コミット済みの metadata-all.json）を差分比較用に退避
          if [ -f metadata-all.json ]; then
            cp metadata-all.json "$RUNNER_TEMP/metadata-prev.json"
          else
            echo '{}' > "$RUNNER_TEMP/metadata-prev.json"
          fi
          node .github/scripts/generate-metadata.mjs . all > metadata-all.json
          echo "Generated metadata for $(cat metadata-all.json | jq -r '."metadata:index".totalCount') articles"

      # sitemap.xml を生成
      - name: Generate sitemap.xml
        run: |
          node .github/scripts/generate-sitemap.mjs metadata-all.json > sitemap.xml
          echo "Generated sitemap.xml ($(grep -c '<url>' sitemap.xml) URLs)"

      # Wrangler CLIでKVを更新
      - name: Update Workers KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler

          prev="$RUNNER_TEMP/metadata-prev.json"
          force="${{ github.event.inputs.force_kv_update }}"
          updated=0
          unchanged=0

          # 内容が変わったキーのみ書き込む（KVの書き込み回数を削減するため）
          # 対象: metadata:index / metadata:months / 各月（metadata:yyyy/mm）
          # updatedAt は実行のたびに変わるため比較対象から除外する
          normalize='.[$k] | if type == "object" then del(.updatedAt) else . end'
          while read -r key; do
            new_value=$(jq -S --arg k "$key" "$normalize" metadata-all.json)
            old_value=$(jq -S --arg k "$key" "$normalize" "$prev")
            if [ "$force" != "true" ] && [ "$new_value" = "$old_value" ]; then
              unchanged=$((unchanged + 1))
              continue
            fi
            echo "Updating $key..."
            jq --arg k "$key" '.[$k]' metadata-all.json | \
              wrangler kv key put "$key" \
                --namespace-id=${{ secrets.KV_NAMESPACE_ID }} \
                --remote \
                --path=/dev/stdin
            updated=$((updated + 1))
          done < <(jq -r 'keys[] | select(startswith("metadata:"))' metadata-all.json)

          echo "KV metadata: updated=$updated unchanged=$unchanged"
      
      # 生成したサムネイルをR2にアップロード
      - name: Upload thumbnails to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          newly_generated_list="/tmp/new_thumbnails.txt"
          if [ ! -s "$newly_generated_list" ]; then
            echo "No new thumbnails to upload."
            exit 0
          fi

          while read file; do
            [ -z "$file" ] && continue
            # 例: 2026/02/06/Topic/thumbnail.png
            key=${file#./}
            echo "Uploading $file to R2 as $key..."
            wrangler r2 object put "$R2_BUCKET/$key" --remote --file "$file"
          done < "$newly_generated_list"

      # HTMLファイルをコミット
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "**/slide.html" metadata-all.json sitemap.xml
          git add "**/thumbnail.png" || true
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "Generate HTML, metadata, and sitemap [skip ci]"
          git push

      # 変更された記事の marp-site コンテンツキャッシュを削除
      # 生成ファイルの push 後に実行する（push 前に削除すると、古い内容が再キャッシュされるため）
      - name: Purge marp-site content cache
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          SYNC_URL: https://whatsnew-marp.nnydtmg.com/api/sync
        run: |
          changed_files="${{ steps.changed.outputs.changed_files }}"
          ids_file="$RUNNER_TEMP/purge_ids.txt"

          # yyyy/mm/dd/<title>/(summary.md|slide.md|slide.html) → yyyy-mm-dd-<title>
          # （記事IDの形式は .github/scripts/generate-metadata.mjs と同じ）
          grep -E '^[0-9]{4}/[0-9]{2}/[0-9]{2}/[^/]+/(summary\.md|slide\.md|slide\.html)$' "$changed_files" | \
            sed -E 's#^([0-9]{4})/([0-9]{2})/([0-9]{2})/([^/]+)/[^/]+$#\1-\2-\3-\4#' | \
            sort -u > "$ids_file" || true

          count=$(wc -l < "$ids_file")
          if [ "$count" -eq 0 ]; then
            echo "No changed articles. Nothing to purge."
            exit 0
          fi
          if [ -z "$SYNC_SECRET" ]; then
            echo "::warning::SYNC_SECRET is not set. Skipping cache purge for $count article(s)."
            exit 0
          fi

          echo "Purging cache for $count article(s):"
          cat "$ids_file"

          # /api/sync は1リクエストあたり最大100記事
          split -l 100 "$ids_file" "$RUNNER_TEMP/purge_chunk_"
          for chunk in "$RUNNER_TEMP"/purge_chunk_*; do
            jq -R . "$chunk" | jq -sc '{articleIds: .}' | \
              curl -fsS -X POST "$SYNC_URL" \
                -H "X-Sync-Secret: $SYNC_SECRET" \
                -H 'Content-Type: application/json' \
                --data-binary @-
            echo
          done
